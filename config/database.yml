default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  checkout_timeout: <%= ENV.fetch("DB_CHECKOUT_TIMEOUT", 5) %>
  statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT", 5000) %>

development:
  <<: *default
  database: billetto_rails_test_development

test:
  <<: *default
  database: billetto_rails_test_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  sslmode: <%= ENV.fetch("DB_SSLMODE", "prefer") %>
